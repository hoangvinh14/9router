name: Budget SQLite persistence

on:
  push:
    paths:
      - ".github/workflows/budget-sqlite.yml"
      - "tests/fixtures/budget/run-platform-persistence.mjs"
      - "tests/unit/budget-sqljs-fallback.test.js"
      - "src/lib/accounting/**"
      - "src/lib/db/**"
      - "src/lib/dataDir.js"

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        engine: [bun, better-sqlite3]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
      - if: matrix.engine == 'bun'
        run: |
          npm install --global bun@1.4.5 --no-audit --no-fund
          bun tests/fixtures/budget/run-platform-persistence.mjs
      - if: matrix.engine == 'better-sqlite3'
        run: |
          npm install --no-save --omit=dev better-sqlite3@12.11.1 --no-audit --no-fund
          node tests/fixtures/budget/run-platform-persistence.mjs better-sqlite3

  windows:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24.21.0"
      - run: node tests/fixtures/budget/run-platform-persistence.mjs
      - run: npm install --no-audit --no-fund
      - name: Verify SQL.js fallback and image publication
        run: |
          npm --prefix tests install --no-audit --no-fund
          npm --prefix tests test -- unit/budget-sqljs-fallback.test.js
      - name: Build the standalone app
        shell: pwsh
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_DIST_DIR: budget-ci-build
        run: |
          $env:DATA_DIR = Join-Path $env:RUNNER_TEMP '9router-budget-build-data'
          $env:APPDATA = Join-Path $env:RUNNER_TEMP '9router-budget-build-appdata'
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path budget-ci-build/standalone/server.js)) { throw 'Missing standalone server' }
