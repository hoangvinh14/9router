name: Budget SQLite persistence

on:
  push:
    paths:
      - ".github/workflows/budget-sqlite.yml"
      - "tests/fixtures/budget/run-platform-persistence.mjs"
      - "src/lib/accounting/**"
      - "src/lib/db/**"
      - "src/lib/dataDir.js"

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24.21.0"
      - run: node tests/fixtures/budget/run-platform-persistence.mjs
